name: CI

# Tests only. Deployment is deliberately not automated: it runs from a developer
# machine through deploy/deploy.sh, which reads .env and puts the credentials
# into Secret Manager. A push to main therefore verifies the code and changes
# nothing that is running.
#
# Documentation and dashboard definitions are excluded from the trigger: they
# cannot break the suite, and running it on a README paragraph wastes four
# minutes for a guaranteed pass.
on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "web/**"
      - "scripts/**"
      - "deploy/**"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

jobs:
  # The suite is a gate, not a report: a broken investigation loop is a broken
  # demo, and the failure is invisible until someone clicks Launch Agent.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install services
        run: |
          python -m pip install --upgrade pip
          pip install \
            -e services/render-sim -e services/mcp-gateway \
            -e services/impact-engine -e services/action-executor \
            -e services/agent-worker -e services/api-gateway \
            -e services/stream-service
          pip install pytest pytest-asyncio pytest-cov

      # One service at a time: each pins its own `src` package, so pointing
      # pytest at two service directories at once makes the import ambiguous and
      # collection fails.
      #
      # impact-engine used to be run with --no-cov, which silently disabled
      # the --cov-fail-under=95 in its pyproject: the only coverage gate in
      # the repo was enforced nowhere except on a developer's own machine,
      # where it failed. It is met now, so it runs like everything else.
      - name: Run tests
        run: |
          set -e
          for s in render-sim mcp-gateway impact-engine action-executor \
                   agent-worker api-gateway stream-service; do
            echo "::group::$s"
            python -m pytest "services/$s/tests" -q
            echo "::endgroup::"
          done

      # The web app ships in the same image, so its typecheck and unit tests
      # gate the deploy alongside the services. A test runner that CI never
      # invokes is the coverage gate all over again.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web typecheck and tests
        run: |
          npm --prefix web ci
          npm --prefix web run typecheck
          npm --prefix web run test

      - name: Submission compliance audit
        run: python scripts/compliance_audit.py
